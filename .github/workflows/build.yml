name: Build MeraSaathi APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf buildsrc
          mkdir buildsrc

          unzip -q "$ZIP" -d buildsrc

          PROJECT_DIR="$(find buildsrc -type f -name 'settings.gradle.kts' -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        shell: bash
        run: |
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

          echo "Created:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeraSaathi-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
